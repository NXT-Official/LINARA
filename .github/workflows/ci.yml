name: QA

# The full local QA pass (npm run qa: typecheck, lint, unit and SQL tests,
# production build, browser tests against that build), on every push to
# main and on pull requests into it. The pre-push hook only runs qa:fast.
#
# The browser tests run against the sandbox Supabase project and sign in with
# the e2e test accounts; they change no data. They need these repository
# secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL, SUPABASE_ANON_KEY       the sandbox project, as in .env
#   E2E_MANAGER_EMAIL, E2E_MANAGER_PASSWORD
#   E2E_STAFF_EMAIL, E2E_STAFF_PASSWORD   as in .env.e2e
# Without the E2E_* ones the signed-in tests skip themselves.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch replaces a run still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: npm run qa
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 24, as on the developers' machines: npm 10 (Node 22) reads
      # package-lock.json differently and refuses `npm ci`.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Browsers for the browser tests
        run: npx playwright install --with-deps chromium

      - name: Formatting
        run: npx prettier --check .

      - name: npm run qa
        run: npm run qa
        env:
          CI: "true"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
          E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
          E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
          E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
          # The AI features answer from fixtures, never OpenAI.
          USE_MOCK_AI: "true"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            qa-reports/
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
