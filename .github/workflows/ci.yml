name: Linara CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Ensure concurrent runs on the same branch cancel previous builds to save pipeline resources
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Code Quality & Compile Verification
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: 2. Set Up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm" # Automates caching of node_modules and npm dependencies

      - name: 3. Install Package Dependencies (Clean Install)
        run: npm ci

      - name: 4. Check Formatting (Prettier Guard)
        run: npx prettier --check .

      - name: 5. Execute ESLint SAST Scans
        run: npm run lint

      - name: 6. Enforce Strong TypeScript Type Check
        run: npx tsc --noEmit

      - name: 7. Execute Production Compile (Nitro Bundling)
        run: npm run build
        env:
          # Inject mock build-time environment coordinates so Nitro doesn't throw errors
          SUPABASE_URL: "https://mock-supabase-url.supabase.co"
          SUPABASE_ANON_KEY: "mock-anon-key"
          JWT_SECRET: "mock-jwt-secret-string-at-least-32-chars-long"
          SYSTEM_CRON_SECRET: "mock-cron-secret"
          REGIONAL_MINIMUM_WAGE: "6000.00"

      - name: 8. Run Unit/Integration Tests (Vitest)
        run: npm run test

      - name: 9. Install Playwright Browser (Chromium only, matches playwright.config.ts)
        run: npx playwright install --with-deps chromium

      - name: 10. Run End-to-End Smoke Tests (Playwright)
        run: npm run test:e2e
        env:
          # playwright.config.ts boots the dev server itself; it needs the
          # same mock coordinates as the build step above to start cleanly.
          SUPABASE_URL: "https://mock-supabase-url.supabase.co"
          SUPABASE_ANON_KEY: "mock-anon-key"
          JWT_SECRET: "mock-jwt-secret-string-at-least-32-chars-long"
          SYSTEM_CRON_SECRET: "mock-cron-secret"
          REGIONAL_MINIMUM_WAGE: "6000.00"

  # optional deployment check
  deploy-preview:
    name: Stage Preview Check
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Log Verification Check
        run: |
          echo "Production-ready build succeeded and verified."
          echo "Ready for secure deployment to Cloudflare Pages edge hosting."
